[package]
name = "omni_shell"
version = "0.1.0"
edition = "2024"

[dependencies]
glob = "0.3.4"
rustyline = { version = "18.0.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = "3.1.2"
shlex = "2.0.1"
toml = "1.1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
